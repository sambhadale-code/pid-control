[project]
name = "pid-control"
version = "0.1.0"
description = "PID control assignment simulator and graph generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "reportlab>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pid_assignment"]
